name: schema-baseline

# supabase/baseline/ is a schema-only snapshot of the live App DB (no rows): the starting point
# for every new environment (UAT, production, DR). See supabase/baseline/README.md.
#
# Every run proves it still matches live:
#   1. snapshot live (Ficium schemas + what we keep in Supabase-managed schemas)
#   2. restore that snapshot into an empty Supabase database and snapshot it again, so live and
#      the built copy are dumped the same way (live goes through the pooler)
#   3. build a second empty Supabase database from supabase/baseline/ + migrations, up to the
#      point the live ledger has reached, and snapshot it
#   4. compare: any difference fails, including changes made on live without a migration file
#   5. apply the migrations live has not run yet, to prove they apply cleanly
#
# On a schema-baseline/* PR branch it first regenerates supabase/baseline/ from live and commits
# it back once steps 3-5 pass.

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/baseline/**"
      - "scripts/app_schema_baseline.py"
      - ".github/workflows/schema-baseline.yml"
  schedule:
    - cron: "40 5 * * *"   # daily, after the portal's 05:15 run
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write   # only to commit a regenerated snapshot to a schema-baseline/* PR branch
    services:
      # Two empty Supabase Postgres servers, the same major version as live. The image creates the
      # auth, storage, vault, cron and net schemas that our objects depend on.
      canon:
        image: supabase/postgres:17.6.1.121
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["54321:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s --health-timeout 5s --health-retries 30
      scratch:
        image: supabase/postgres:17.6.1.121
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["54322:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      APP_DB_DSN: ${{ secrets.APP_DB_DSN }}
      CANON_DSN: postgresql://supabase_admin:ci-only@localhost:54321/postgres
      SCRATCH_DSN: postgresql://supabase_admin:ci-only@localhost:54322/postgres
      REGENERATE: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'schema-baseline/') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install
        run: pip install psycopg2-binary==2.9.13

      - name: Require the live DSN (never skip silently)
        run: |
          if [ -z "$APP_DB_DSN" ]; then
            echo "::error title=schema-baseline::Repository secret APP_DB_DSN is not set (App DB session pooler, port 5432)."
            exit 1
          fi

      - name: Live ledger point
        id: point
        run: |
          point=$(python scripts/app_schema_baseline.py live-point "$APP_DB_DSN")
          echo "point=$point" >> "$GITHUB_OUTPUT"
          echo "Live ledger is at $point."

      - name: Snapshot live, then restore and re-snapshot it on a direct connection
        run: |
          python scripts/app_schema_baseline.py snapshot "$APP_DB_DSN" /tmp/live
          for f in /tmp/live/*.sql; do python scripts/app_schema_baseline.py scan "$f"; done
          python scripts/app_schema_baseline.py restore /tmp/live "$CANON_DSN"
          python scripts/app_schema_baseline.py snapshot "$CANON_DSN" /tmp/canon

      - name: Regenerate the baseline (schema-baseline/* branches)
        if: env.REGENERATE == 'true'
        env:
          POINT: ${{ steps.point.outputs.point }}
        run: python scripts/app_schema_baseline.py write /tmp/canon --through "$POINT"

      - name: Baseline present
        run: |
          if [ ! -f supabase/baseline/BASELINE ]; then
            echo "::error title=schema-baseline::No supabase/baseline/ yet. Open a PR from a schema-baseline/* branch to generate it."
            exit 1
          fi

      - name: Build a new database from the baseline, to the live point
        env:
          POINT: ${{ steps.point.outputs.point }}
        run: |
          python scripts/app_schema_baseline.py build "$SCRATCH_DSN" --upto "$POINT"
          python scripts/app_schema_baseline.py snapshot "$SCRATCH_DSN" /tmp/scratch

      - name: Built database is identical to live
        run: |
          status=0
          for f in schema.sql platform_post.sql; do
            if ! diff -u "/tmp/canon/$f" "/tmp/scratch/$f" > "/tmp/$f.diff"; then
              n=$(grep -cE '^[-+][^-+]' "/tmp/$f.diff" || true)
              echo "::error title=schema-baseline::$f built from supabase/ differs from live ($n changed lines)."
              head -300 "/tmp/$f.diff"
              { echo "## $f: live (-) vs built from supabase/ (+)"; echo '```diff'; head -300 "/tmp/$f.diff"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              status=1
            else
              echo "$f identical: $(wc -l < "/tmp/canon/$f") lines"
            fi
          done
          python scripts/app_schema_baseline.py covers /tmp/live/platform_pre.sql /tmp/scratch/platform_pre.sql || status=1
          exit $status

      - name: Migrations not yet on live apply cleanly
        env:
          POINT: ${{ steps.point.outputs.point }}
        run: python scripts/app_schema_baseline.py apply-after "$SCRATCH_DSN" --after "$POINT"

      - name: Commit the regenerated baseline
        if: env.REGENERATE == 'true'
        env:
          POINT: ${{ steps.point.outputs.point }}
        run: |
          git config user.name "Ficium Admin"
          git config user.email "kishan.jeebun@ficium.net"
          git add supabase/baseline
          if git diff --cached --quiet; then
            echo "baseline unchanged"
            exit 0
          fi
          git commit -m "chore(db): App DB baseline through $POINT (generated from live, verified)"
          git push
