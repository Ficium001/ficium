name: DB Keepalive

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://ficium.vercel.app/api/keepalive)
          echo "Keepalive response: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: keepalive returned $STATUS"
          fi
