name: Mobile release

# Builds the signed store binaries and sends them to the stores' TESTING
# channels: Google Play internal testing and TestFlight. Nothing here can
# publish to the public: promotion to production is a human step in the Play
# Console / App Store Connect.
#
# Started by hand (Actions → Mobile release → Run workflow), from main only.
#   web     → the native web bundle, built against real config (no placeholders)
#   android → signed AAB (upload key) → Play internal testing
#   ios     → signed IPA (App Store Connect API key) → TestFlight
#
# Setup, secrets and the first-release steps: docs/mobile/RELEASE.md.
#
# Supply chain: the only third-party actions are GitHub's own, pinned to commit
# SHAs. The steps that hold signing keys or store credentials run only the
# platform toolchains (Gradle, xcodebuild) and scripts in this repository.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown in the stores (e.g. 1.0.0)"
        required: true
        type: string
      platform:
        description: "Which app to build"
        required: true
        default: both
        type: choice
        options: [both, android, ios]
      upload:
        description: "Send to the store testing channel (off = build signed files only)"
        required: true
        default: true
        type: boolean
      play_status:
        description: "Play release status (draft until the app's first review has passed)"
        required: true
        default: draft
        type: choice
        options: [draft, completed]
      build_number:
        description: "Build number override (blank = this workflow's run number)"
        required: false
        type: string

# Never two releases at once, and never cancel one half-way through an upload.
concurrency:
  group: mobile-release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail

env:
  APP_ID: net.ficium.app
  APP_VERSION_NAME: ${{ inputs.version }}
  APP_VERSION_CODE: ${{ inputs.build_number || github.run_number }}
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  web:
    name: Native web bundle
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check release inputs
        run: |
          [[ "$APP_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like 1.0.0"; exit 1; }
          [[ "$APP_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "::error::build number must be a positive whole number"; exit 1; }
          [[ -n "$VITE_SUPABASE_URL" && -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ]] || {
            echo "::error::Set the repository variables VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY. A release is never built against placeholders."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Authenticate private dependencies (SSH -> HTTPS with token)
        run: |
          git config --global url."https://${FICIUM_SHARED_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://${FICIUM_SHARED_TOKEN}@github.com/".insteadOf "git@github.com:"
        env:
          FICIUM_SHARED_TOKEN: ${{ secrets.FICIUM_SHARED_TOKEN }}
      - run: npm ci
      - name: Native config consistency
        run: npm run check:native
      - name: Tests
        run: npm test
      - name: Build (vite --mode native)
        run: npx tsc -b && npx vite build --mode native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-web
          path: dist
          retention-days: 1

  android:
    name: Android (signed AAB → Play internal testing)
    needs: web
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Authenticate private dependencies
        run: git config --global url."https://${FICIUM_SHARED_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
        env:
          FICIUM_SHARED_TOKEN: ${{ secrets.FICIUM_SHARED_TOKEN }}
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-web
          path: dist
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npx cap sync android

      - name: Upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set (docs/mobile/RELEASE.md)."; exit 1; }
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed release bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Bundle is signed with the upload key, not a debug key
        run: |
          aab=android/app/build/outputs/bundle/release/app-release.aab
          verdict="$(jarsigner -verify "$aab")"
          [[ "$verdict" == *"jar verified"* ]] || { echo "::error::The release bundle is not signed."; exit 1; }
          signer="$(keytool -printcert -jarfile "$aab")"
          if [[ "$signer" == *"CN=Android Debug"* ]]; then
            echo "::error::The release bundle is signed with a debug key."; exit 1
          fi

      - name: Keep the bundle and R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ficium-android-${{ inputs.version }}-${{ env.APP_VERSION_CODE }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Upload to Play internal testing
        if: inputs.upload
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_STATUS: ${{ inputs.play_status }}
        run: |
          node scripts/play-upload.mjs \
            --aab android/app/build/outputs/bundle/release/app-release.aab \
            --package "$APP_ID" \
            --version-code "$APP_VERSION_CODE" \
            --release-name "$APP_VERSION_NAME" \
            --track internal \
            --status "$PLAY_STATUS"

      - name: Remove the upload key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

  ios:
    name: iOS (signed IPA → TestFlight)
    needs: web
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Authenticate private dependencies
        run: git config --global url."https://${FICIUM_SHARED_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
        env:
          FICIUM_SHARED_TOKEN: ${{ secrets.FICIUM_SHARED_TOKEN }}
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-web
          path: dist
      - run: npx cap sync ios

      - name: App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          [[ -n "$APPLE_TEAM_ID" && -n "$ASC_KEY_ID" && -n "$ASC_ISSUER_ID" && -n "$ASC_PRIVATE_KEY" ]] || {
            echo "::error::Set variable APPLE_TEAM_ID and secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY (docs/mobile/RELEASE.md)."; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey.p8"

      # Xcode signs with certificates and profiles it manages in the Apple
      # account through the API key, so no certificate or profile is stored in
      # GitHub and none can expire unnoticed.
      - name: Archive (Release, signed)
        run: |
          xcodebuild archive -quiet \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Ficium.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$APP_VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$APP_VERSION_CODE"

      - name: Export options
        env:
          EXPORT_DESTINATION: ${{ inputs.upload && 'upload' || 'export' }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>${EXPORT_DESTINATION}</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: ${{ inputs.upload && 'Sign and upload to TestFlight' || 'Sign and export IPA' }}
        run: |
          xcodebuild -exportArchive -quiet \
            -archivePath "$RUNNER_TEMP/Ficium.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Keep the IPA
        if: ${{ !inputs.upload }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ficium-ios-${{ inputs.version }}-${{ env.APP_VERSION_CODE }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30

      - name: Remove the API key from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
