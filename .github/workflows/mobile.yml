name: Mobile

# Builds the iOS and Android app shells on every PR and push to main, so a
# web change that breaks the native app is caught before merge.
#   config  → native config consistency (domains, app ids)
#   web     → the native web bundle (vite --mode native), shared by both apps
#   android → debug APK (artifact, 7 days)
#   ios     → unsigned simulator build (compile check; no signing secrets here)
# Signing and store upload are a separate, manually-triggered release workflow
# (not yet added: needs the Apple/Google accounts).
#
# Third-party actions are pinned to commit SHAs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Public values (the publishable key is designed to ship in clients). Set as
  # repository *variables*. Without them CI still compiles against placeholders
  # but publishes no installable artifact.
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder' }}
  REAL_CONFIG: ${{ vars.VITE_SUPABASE_URL != '' && vars.VITE_SUPABASE_PUBLISHABLE_KEY != '' }}

jobs:
  web:
    name: Native web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Authenticate private dependencies (SSH -> HTTPS with token)
        run: |
          git config --global url."https://${FICIUM_SHARED_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://${FICIUM_SHARED_TOKEN}@github.com/".insteadOf "git@github.com:"
        env:
          FICIUM_SHARED_TOKEN: ${{ secrets.FICIUM_SHARED_TOKEN }}
      - run: npm ci
      - name: Native config consistency
        run: npm run check:native
      - name: Build (vite --mode native)
        run: npx tsc -b && npx vite build --mode native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-web
          path: dist
          retention-days: 1

  android:
    name: Android (debug APK)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Authenticate private dependencies
        run: git config --global url."https://${FICIUM_SHARED_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
        env:
          FICIUM_SHARED_TOKEN: ${{ secrets.FICIUM_SHARED_TOKEN }}
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-web
          path: dist
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: Upload APK (only when built with real config)
        if: env.REAL_CONFIG == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ficium-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  ios:
    name: iOS (simulator compile)
    needs: web
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Authenticate private dependencies
        run: git config --global url."https://${FICIUM_SHARED_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
        env:
          FICIUM_SHARED_TOKEN: ${{ secrets.FICIUM_SHARED_TOKEN }}
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-web
          path: dist
      - run: npx cap sync ios
      - name: Build for simulator (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          exit ${PIPESTATUS[0]}
